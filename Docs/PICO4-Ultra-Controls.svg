      <path d="M1150 220C1205 220 1244 254 1246 310C1248 349 1230 382 1202 399L1226 594C1231 642 1202 676 1158 681C1111 686 1076 657 1075 608L1078 414C1049 397 1030 365 1032 326C1035 262 1084 220 1150 220Z" stroke-width="6"/>
      <path d="M1202 399C1172 414 1108 418 1078 414" stroke-width="3"/>
      <path d="M1211 367C1228 375 1240 392 1242 414L1244 459" stroke-width="5"/>
      <path d="M1079 397L1047 411L1052 455L1079 449" stroke-width="6"/>
      <path d="M1080 469L1052 474L1058 551L1078 554" stroke-width="6"/>


      <circle cx="1174" cy="300" r="17" stroke-width="4"/>
      <path d="M1174 277V323M1151 300H1197" stroke-width="3"/>

      <circle cx="1094" cy="283" r="13" stroke-width="3"/>
      <circle cx="1069" cy="313" r="13" stroke-width="3"/>

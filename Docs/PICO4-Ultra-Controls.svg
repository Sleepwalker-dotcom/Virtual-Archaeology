    <path d="M549 431C694 432 664 620 748 656" stroke-width="3"/>
    <path d="M546 512C660 520 670 640 748 674" stroke-width="3"/>
    <path d="M1051 431C906 432 936 620 852 656" stroke-width="3"/>

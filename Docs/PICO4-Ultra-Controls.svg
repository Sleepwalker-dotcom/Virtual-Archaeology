<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">PICO 4 Ultra controller guide</title>
  <desc id="desc">Left stick moves, right stick turns, and all four triggers grab.</desc>

  <rect width="1600" height="800" fill="#000"/>


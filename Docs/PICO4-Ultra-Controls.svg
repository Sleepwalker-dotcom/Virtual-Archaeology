    <path d="M426 245V174H234" stroke-width="4"/>
    <circle cx="426" cy="245" r="7" fill="#fff" stroke="none"/>
    <path d="M1174 245V174H1366" stroke-width="4"/>
    <circle cx="1174" cy="245" r="7" fill="#fff" stroke="none"/>

